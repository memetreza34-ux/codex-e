name: Arbeitsordner prüfen
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Ein Bild der Beispielszene rendern
        run: npx remotion still src/remotion/index.ts DatenErklaert work/ci-frame.png --frame=240 --scale=0.25 --gl=swangle --disable-shared-memory-capture
